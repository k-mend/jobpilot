name: Daily Scan

# Runs the per-user job scan once a day. For each active saved search it finds NEW
# matches (skipping jobs the user already saved/applied to) and emails a digest.
# Uses durable Neon Postgres via the DATABASE_URL secret.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      query:
        description: "Optional ad-hoc query (overrides saved searches)"
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.query }}" ]; then
            python -m app.cli scan --query "${{ github.event.inputs.query }}"
          else
            python -m app.cli scan
          fi
