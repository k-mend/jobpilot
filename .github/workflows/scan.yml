name: Scheduled Scan

on:
  schedule:
    # Every day at 06:00 UTC. Adjust as you like.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "Optional ad-hoc query (overrides saved searches)"
        required: false
        default: ""

# Allow the job to commit the updated database back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database (if present on data branch)
        run: |
          git fetch origin data || true
          if git cat-file -e origin/data:jobpilot/jobpilot.db 2>/dev/null; then
            git show origin/data:jobpilot/jobpilot.db > jobpilot.db
            echo "Restored jobpilot.db from data branch."
          else
            echo "No existing database; a fresh one will be created."
          fi

      - name: Seed a demo saved search if DB is empty
        env:
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL || 'demo@example.com' }}
        run: |
          python - <<'PY'
          import os
          from sqlmodel import Session, select
          from app.database import engine, init_db
          from app.models import SavedSearch
          init_db()
          with Session(engine) as s:
              if not s.exec(select(SavedSearch)).first():
                  from app.services import queue
                  u = queue.get_or_create_user(s, os.environ["DEMO_EMAIL"])
                  s.add(SavedSearch(user_id=u.id, description="remote python backend", active=True))
                  s.commit()
                  print("Seeded demo saved search.")
          PY

      - name: Run scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.query }}" ]; then
            python -m app.cli scan --query "${{ github.event.inputs.query }}"
          else
            python -m app.cli scan
          fi

      - name: Commit database back to data branch
        run: |
          git config user.name "jobpilot-bot"
          git config user.email "jobpilot-bot@users.noreply.github.com"
          # Work on an orphan-ish 'data' branch that only carries the DB.
          cp jobpilot.db /tmp/jobpilot.db
          cd "${GITHUB_WORKSPACE}"
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p jobpilot
          cp /tmp/jobpilot.db jobpilot/jobpilot.db
          git add -f jobpilot/jobpilot.db
          git commit -m "chore: update scan database [skip ci]" || echo "No changes."
          git push origin data
