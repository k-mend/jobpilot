<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobPilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">✈ JobPilot</a>
    <nav>
      <a href="/">Search</a>
      <a href="/cv">CV</a>
      <a href="/queue">Queue</a>
      {% if current_user %}
        <a href="/account">Account</a>
        {% if current_user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <span class="navuser">{{ current_user.email }}</span>
        <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/signup">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Runs free on GitHub Actions · prepare-and-review, no blind auto-submit</span>
  </footer>
</body>
</html>
