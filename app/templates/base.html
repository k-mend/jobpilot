<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobPilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">✈ JobPilot</a>
    <nav>
      <a href="/">Search</a>
      <a href="/cv">CV</a>
      <a href="/queue">Queue</a>

    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Runs free on GitHub Actions · prepare-and-review, no blind auto-submit</span>
  </footer>
</body>
</html>
